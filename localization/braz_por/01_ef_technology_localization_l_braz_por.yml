  stockpiling_goods:0 "Estocagem de Produtos"
  stockpiling_goods_desc:0 "Uma vez que a tecnologia de Estoque Nacional seja desbloqueada, seu país começará a [concept_flow_storage]. O [concept_flow_storage] armazena o excedente do mercado, sem custo. Ao contrário da ordem de armazenamento ou liberação possível graças à tecnologia de estoque nacional, que pode ser cara para o país, mas permite que você faça melhores reservas estratégicas."

  national_stockpile:0 "Estoque Nacional"
  national_stockpile_desc:0 "Esta tecnologia permitirá que você crie um Estoque Nacional"

  financial_center:0 "Centro Financeiro"
  financial_center_desc:0 "Esta tecnologia permitirá que você crie um Centro Financeiro"

