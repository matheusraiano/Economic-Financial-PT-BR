  law_war_economy: "Economia de Guerra"

  # Desc :
  law_no_monetary_policy_desc: "Nenhuma trajetória para a moeda nacional."
  law_revaluation_desc: "Aumento no valor da moeda nacional em comparação com o ouro."
  law_devaluation_desc: "Diminuição no valor da moeda nacional em comparação com o ouro."
  law_large_monetary_policy_desc: "O banco central recebe ampla autoridade para intervir em assuntos monetários, permitindo expansão ou contração em larga escala da oferta monetária. Tais poderes permitem ao governo responder agressivamente a crises econômicas, estimular o crescimento, financiar gastos extraordinários ou estabilizar a moeda nacional quando necessário. Os GIs estão mais inclinados a decretar esta lei se a Taxa de Reserva Metálica do Banco Central cair abaixo de 75% ou subir acima de 125%."

  law_war_economy_desc: "Leis que transformam a economia nacional em uma economia de guerra."

  ################################
  # Monetary Value Indexing
  ################################
  lawgroup_monetary_system: "Sistema Monetário"

  law_no_monetary_system: "Sem Sistema Monetário"
  law_fiat_standard: "Padrão Fiduciário"
  law_silver_standard: "Padrão-Prata"
  law_bimetallism_standard: "Padrão Bimetalista"
  law_gold_standard: "Padrão-Ouro"
  law_gold_exchange_standard: "Padrão Câmbio-Ouro"
  law_floating_exchange_rates: "Taxas de Câmbio Flutuantes"

  law_no_monetary_system_icon: "Padrão Fiduciário"
  law_fiat_standard_icon: "@fiat_standard!"
  law_silver_standard_icon: "@silver_standard!"
  law_bimetallism_standard_icon: "@bimetallism_standard!"
  law_gold_standard_icon: "@gold_standard!"
  law_gold_exchange_standard_icon: "@gold_exchange_standard!"

  # Desc :
  law_no_monetary_system_desc: "Sem sistema monetário."
  law_fiat_standard_desc: "Em um sistema monetário de padrão fiduciário, a moeda não é respaldada por quaisquer reservas de metais preciosos. Seu valor deriva exclusivamente da confiança pública e da autoridade do estado emissor. Este modelo depende da capacidade do estado de manter a estabilidade econômica e a confiança na moeda, permitindo flexibilidade nas políticas monetárias, mas também expondo o sistema a riscos de desvalorização se a confiança erodir. Ao contrário de sistemas baseados em ouro ou prata, a moeda fiduciária não garante conversibilidade em recursos físicos."

  law_silver_standard_desc: "Em um sistema monetário de padrão-prata, a moeda é respaldada por reservas de prata, e seu valor está vinculado a uma quantidade específica deste metal precioso. O estado emissor compromete-se a garantir a conversibilidade da moeda em prata, proporcionando um grau de estabilidade ao valor monetário. No entanto, este sistema pode limitar a flexibilidade das políticas monetárias, já que a oferta monetária é diretamente influenciada pelas reservas de prata disponíveis."

  law_bimetallism_standard_desc: "Em um sistema monetário baseado no bimetalismo, tanto ouro quanto prata são usados para apoiar o valor da moeda. O estado emissor garante a conversibilidade da moeda nesses dois metais a uma razão fixa, promovendo estabilidade ao diversificar a reserva de valor. No entanto, o bimetalismo pode ser vulnerável a flutuações nos preços relativos do ouro e da prata, o que pode levar a desequilíbrios monetários e complicar a gestão da política econômica."

  law_gold_standard_desc: "O Padrão-Ouro é um sistema monetário no qual o valor da moeda de um país está diretamente vinculado a uma quantidade específica de ouro. Em tal sistema, as unidades monetárias podem ser convertidas em uma quantidade fixa de ouro, e vice-versa. O Padrão-Ouro foi historicamente usado para ancorar a estabilidade da moeda e garantir confiança no valor do dinheiro. No entanto, foi amplamente abandonado no século XX em favor de sistemas monetários mais flexíveis."
  law_gold_exchange_standard_desc: "O Padrão Câmbio-Ouro foi um sistema monetário que surgiu como uma variação do Padrão-Ouro. Operou durante o período entre guerras, particularmente após a Primeira Guerra Mundial e antes da adoção do sistema de Bretton Woods. No Padrão Câmbio-Ouro, os países mantinham suas reservas não apenas em ouro, mas também em moedas estrangeiras, principalmente o dólar americano, que era conversível em ouro. Isso permitiu maior flexibilidade no comércio e finanças internacionais, já que os países podiam manter reservas em uma mistura de ouro e principais moedas estrangeiras. No entanto, o sistema enfrentou desafios, incluindo a escassez de ouro, levando a ajustes e, finalmente, abrindo caminho para o sistema de Bretton Woods na era pós-Segunda Guerra Mundial."
  law_floating_exchange_rates_desc: "O sistema de Taxas de Câmbio Flutuantes é um arranjo monetário onde os valores das moedas são determinados pelas forças de oferta e demanda nos mercados de câmbio. Ao contrário dos sistemas de taxa de câmbio fixa, onde governos ou bancos centrais estabelecem o valor de sua moeda em relação a outra, as taxas de câmbio flutuantes permitem que os valores das moedas flutuem livremente com base nas condições do mercado"

