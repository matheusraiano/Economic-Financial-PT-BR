  #speculative
  speculative_share_1_button:1 "#b Proibição de Produto Financeiro Estrangeiro#!"
  speculative_share_1_button_desc: "Uma vez promulgada, produtos financeiros estrangeiros não poderão mais ser importados ou consumidos pelos centros financeiros. Isso reduz a produção de fundos mútuos e diminui a participação especulativa do PIB nacional.\n#b Requer que o progresso da bolha especulativa exceda 10%.#!"
  speculative_share_1_button_tt: "#b O progresso da bolha especulativa#! deve ser superior a #b 10%#!. (Atual: [GetPlayer.MakeScope.Var('speculative_share_1').GetValue]%)"

  speculative_share_2_button:1 "#b Lei sobre Regulação da Bolsa de Valores#!"
  speculative_share_2_button_desc: "Esta lei introduz uma supervisão mais rigorosa das operações do mercado de ações, limitando negociações especulativas e investimentos arriscados. Ao restringir a especulação de curto prazo, reduz a demanda por produtos financeiros e gradualmente desacelera o crescimento dos fundos mútuos.\n#B Requer que o progresso da bolha especulativa exceda 20% e reduz 25% da demanda de Produto Financeiro nos centros financeiros.#!"
  speculative_share_2_button_tt: "#b O progresso da bolha especulativa#! deve ser superior a #b 20%#!. (Atual: [GetPlayer.MakeScope.Var('speculative_share_1').GetValue]%)"

  speculative_share_3_button:1 "#b Decreto de Restrição de Crédito e Câmbio#!"
  speculative_share_3_button_desc: "O governo decreta uma restrição severa de crédito e intercâmbios financeiros para conter o superaquecimento do mercado. Esta medida corta diretamente metade da demanda de Produto Financeiro, reduzindo acentuadamente a produção de fundos mútuos e o crescimento especulativo.\n#b Requer que o progresso da bolha especulativa exceda 40% e reduz 50% da demanda de Produto Financeiro nos centros financeiros.#!"
  speculative_share_3_button_tt: "#b O progresso da bolha especulativa#! deve ser superior a #b 40%#!. (Atual: [GetPlayer.MakeScope.Var('speculative_share_1').GetValue]%)"

  speculative_share_4_button:1 "#b Decreto de Emergência sobre Suspensão do Mercado Financeiro#!"
  speculative_share_4_button_desc: "Em resposta a uma crise especulativa crítica, o governo suspende todas as principais operações do mercado financeiro. Importações e trocas de bens financeiros são congeladas, interrompendo a produção de fundos mútuos e esvaziando a bolha à força. Este decreto emergencial, embora estabilize a economia, pode desencadear uma recessão temporária.\n#b Requer que o progresso da bolha especulativa exceda 60% e reduz 75% da demanda de Produto Financeiro nos centros financeiros.#!"
  speculative_share_4_button_tt: "#b O progresso da bolha especulativa#! deve ser superior a #b 60%#!. (Atual: [GetPlayer.MakeScope.Var('speculative_share_1').GetValue]%)"

  speculative_share_5_button:1 "#b Estímulo ao Setor Financeiro#!" #5 [GetBuildingType('building_financial_centre').GetName]
