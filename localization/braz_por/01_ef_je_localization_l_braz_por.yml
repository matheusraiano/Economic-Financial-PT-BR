  status_central_bank_1: "Sem um sistema monetário centralizado, a nação depende de uma colcha de retalhos de métodos de troca. Troca direta, moedas locais obsoletas e uma mistura de moedas estrangeiras circulam lado a lado, destacando o estado fragmentado da economia."
