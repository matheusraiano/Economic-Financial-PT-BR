  scandinavian_monetary_union_je_1: "Convenção da União Monetária Escandinava"
  scandinavian_monetary_union_je_1_reason: "A Convenção sobre a União Monetária Escandinava visa estabelecer uma aliança monetária regional construída em torno de um padrão compartilhado baseado em ouro.\n Este acordo busca introduzir especificações comuns para cunhagem e Política Monetária, permitindo que as moedas dos estados signatários convirjam gradualmente para um sistema unificado.\n\n Uma vez concluída esta entrada no diário, o objetivo final é a assinatura de um tratado monetário de longo prazo entre #v a potência iniciadora#! e os #v estados participantes#!.\n\n Sob este tratado, os países signatários se comprometem a adotar a #v Lei de [GetLawType('law_gold_standard').GetName]#! e o [concept_money_value_target_real] definido pelo iniciador da convenção.\n\n Os estados signatários irão:\n – adotar a taxa de conversão em ouro ([concept_money_value_target_real]) estabelecida pelo iniciador;\n – alinhar seu sistema monetário com o padrão do iniciador (#v Lei de [GetLawType('law_gold_standard').GetName]#!), independentemente de seu regime anterior.\n\n Ao longo do tempo, o valor de suas moedas convergirá para um referencial comum baseado em ouro.\n\n Número atual de países participantes da convenção: #p [GetPlayer.MakeScope.ScriptValue('scandinavian_monetary_union_country_in_debat')+]#!"

  #scandinavian_monetary_union_je_1_desc.1: ""
