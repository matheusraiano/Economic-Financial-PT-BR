  silver_crisis_je_1: "Crise da Prata"
  # silver_crisis_je_1_reason: "O colapso acentuado do preço global da prata, iniciado pelas reformas monetárias de 1873, provoca uma desestabilização progressiva de todos os Estados cuja moeda se baseia no #v bimetalismo#! ou no #v padrão-prata#!.\n\nÀ medida que a diferença entre a paridade legal e o preço internacional do metal branco se amplia, nosso sistema monetário se torna vulnerável à arbitragem, à fuga do ouro e a uma perda generalizada de confiança.\n\nEsta entrada de diário representa a evolução desta #v crise monetária mundial#!: o colapso do valor da prata, os ataques às reservas nacionais, as pressões políticas internas e a instabilidade crescente resultante.\n\nEnquanto nosso país mantiver uma moeda baseada na prata – seja o #v padrão-prata#! puro ou o #v bimetalismo#! – estaremos expostos a essas tensões crescentes.\n\nO objetivo final deste diário é a transição para um #v padrão-ouro#! estável, pondo fim à instabilidade estrutural causada pelo colapso da prata.\n\nAtualmente, esta entrada de diário se aplica a todos os Estados que usam a prata como base de seu sistema monetário."
  silver_crisis_je_1_reason: "O colapso acentuado do preço global da prata, iniciado pelas reformas monetárias dos EUA de 1873 #v (A Lei de Cunhagem de 1873)#!, está progressivamente desestabilizando todos os estados cujas moedas dependem do #v sistema bimetálico#! ou do #v padrão-prata#!.\n\nÀ medida que a diferença entre a paridade oficial e o valor internacional da prata se amplia, nosso sistema monetário se torna cada vez mais vulnerável à arbitragem, saídas de ouro e uma perda geral de confiança.\n\nEsta entrada de diário representa o desenrolar desta #v crise monetária global#!: o declínio no valor da prata, ataques às reservas nacionais, pressões políticas internas e o aumento resultante da instabilidade.\n\nEnquanto nosso país mantiver uma moeda baseada na prata — seja através do #v padrão-prata#! ou de um #v regime bimetálico#! — permaneceremos expostos a essas tensões crescentes.\n\nO objetivo final deste diário é a transição para um #v padrão-ouro#! estável, pondo fim à instabilidade estrutural causada pela depreciação da prata.\n\nEsta entrada de diário atualmente se aplica a todos os estados que usam a prata como base de seu sistema monetário."

  silver_crisis_je_1_desc.1: "Os Estados Unidos experimentaram a Lei de Cunhagem de 1873"

