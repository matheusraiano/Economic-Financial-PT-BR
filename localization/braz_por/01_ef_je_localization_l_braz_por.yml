  economic_sentiment_index_base_1_button_desc: "Solicite ao setor privado que invista em novos [GetBuildingType('building_ef_private_construction').GetName]. Um número de tais setores será construído em todo o país.\nNo entanto, uma vez feita essa solicitação, o setor privado ficará incapaz de responder a novas demandas governamentais por um certo período de tempo."
