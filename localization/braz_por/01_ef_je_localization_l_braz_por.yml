  latin_monetary_union_je_1: "Convenção da União Monetária Latina"
  latin_monetary_union_je_1_reason: "A Convenção sobre a União Latina visa estabelecer uma aliança monetária regional, fundada pela França, Bélgica, Suíça e Itália.\n Este acordo estabelece padrões comuns para moedas de ouro e prata, permitindo que as moedas dos estados membros circulem livremente em toda a União.\n\n Uma vez concluída a entrada no diário, o objetivo final é a assinatura de um tratado monetário de vinte anos entre #v a França#!, a potência iniciadora, e os #v países participantes#!.\n\n Este tratado estabelece uma estrutura monetária comum na qual os estados se comprometem a respeitar os padrões definidos pela França.\n\n Os países que assinarem o tratado verão:\n - a taxa de câmbio ouro/prata fixada de acordo com os valores em vigor na França\n - o padrão monetário alinhado com o padrão monetário francês (independentemente do padrão atual)\n\n assim, ao longo dos anos, o valor das moedas desses diferentes países tenderá a um valor comum.\n\n Número atual de países na convenção: #p [GetPlayer.MakeScope.ScriptValue('latin_monetary_union_country_in_debat')+]#!"

