  speculative_share_9_button:1 "#b Estímulo à Demanda de Construção #!"
  speculative_share_9_button_desc: "O governo busca estimular a construção privada reduzindo a taxa básica. Isso resultará na construção de #b 5 [GetBuildingType('building_ef_private_construction').GetName]#!. No entanto, crescimento excessivo pode arriscar desencadear uma Economia Superconstruída."
