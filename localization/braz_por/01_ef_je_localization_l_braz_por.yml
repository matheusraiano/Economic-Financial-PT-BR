central_bank_bankruptcy_country_tooltip:0 "#T #l Valor da Moeda em Ouro:#! [GetPlayer.MakeScope.ScriptValue('money_value_in_gold')|D]@gold!#! \nO valor em ouro atual da moeda nacional @gold! é #b [GetPlayer.MakeScope.ScriptValue('money_value_in_gold')|D]#! @gold!. Se este valor permanecer abaixo de #n 0.01#! @gold! por mais de #bold 1 ano#!, uma #l #n Falência do Banco Central#!#! pode surgir. Se o país já estiver experimentando instabilidade econômica ou financeira, cair abaixo de #n 0.01#! @gold! desencadeará imediatamente uma #n crise econômica multifatorial#!.\n > Por #u 2 anos#! o país estará em crise e impedirá o estabelecimento de rotas de [concept_trade] (#u 3 anos#! após a crise, você poderá criar uma nova moeda)."

currency_crisis_country_tooltip:0 "#T #l Valor da Moeda ao Longo de 1 Ano:#! [GetPlayer.MakeScope.ScriptValue('money_value_dif_1_final')|%|=+]#! \nSe o valor da moeda nacional declinar mais de #n -50%#! dentro de #bold 1 ano#!, uma #l #n Crise Monetária#!#! pode surgir. Se o país já estiver experimentando instabilidade econômica ou financeira, uma desvalorização monetária excedendo #n -50%#! desencadeará imediatamente uma #n crise econômica multifatorial#!.\n > Por #u 2 anos#! o país estará em crise e impedirá o estabelecimento de rotas de [concept_trade] (#u 3 anos#! após a crise, você poderá criar uma nova moeda)."

economic_crisis_country_tooltip:0 "#T #l [concept_gdp] ao Longo de 1 Ano:#! [GetPlayer.MakeScope.ScriptValue('GDP_dif_1_final')|%|=+]#! \nSe o [concept_gdp] nacional declinar mais de #n -50%#! dentro de #bold 1 ano#!, uma #l #n Crise Econômica#!#! pode surgir. Se o país já estiver experimentando instabilidade econômica ou financeira, uma contração econômica excedendo #n -50%#! desencadeará imediatamente uma #n crise econômica multifatorial#!.\n > Por #u 2 anos#! #t todos os edifícios#! no país receberão um modificador que diminuirá sua produtividade em mais de #N 50%#!."

financial_crash_country_tooltip:0 "#T #l Variação do Índice do mercado de ações ao Longo de 1 Ano:#! [GetPlayer.MakeScope.ScriptValue('GDP_dif_1_final')|%|=+]#! \nSe o Índice do mercado de ações nacional declinar mais de #n -50%#! dentro de #bold 1 ano#!, um #l #n Colapso Financeiro#!#! pode surgir. Se o país já estiver experimentando instabilidade econômica ou financeira, um colapso de mercado excedendo #n -50%#! desencadeará imediatamente uma #n crise econômica multifatorial#!.\n > Por #u 2 anos#! #t todos os edifícios privados#! no país receberão um modificador que diminuirá sua produtividade em mais de #N 50%#!."

country_bankruptcy_tooltip:0 "#T #l Falência do País:#!#! \n Quando o país declara falência, ele entra em um período de instabilidade econômica por toda a duração do modificador. Embora esta seja a crise maior menos prejudicial à economia, ela cria um ambiente altamente vulnerável no qual qualquer crise adicional emergente escalará imediatamente para uma #n crise econômica multifatorial#!."


