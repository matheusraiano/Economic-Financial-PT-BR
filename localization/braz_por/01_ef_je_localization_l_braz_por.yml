  bank_je_central_1:0 "Lei de Fundação do Banco Central"
  bank_je_central_1_reason:0 "Um banco central permite a unificação e centralização da produção de moedas e notas — um marco fundamental no desenvolvimento econômico de qualquer nação.\n \n Um banco central aparecerá automaticamente uma vez que o PIB do país exceda 5 milhões, ou quando a tecnologia Banco Central for descoberta."

  financial_center_je_1:0 "Autorização da Bolsa de Valores"
  financial_center_je_1_reason:0 "Um banco central permite a unificação e centralização da produção de moedas e notas — um marco fundamental no desenvolvimento econômico de qualquer nação.\n \n Um banco central aparecerá automaticamente uma vez que o PIB do país exceda 5 milhões, ou quando a tecnologia Banco Central for descoberta."

##########################
#financial_center_je
##########################

  financial_center_je_2:0 "Escritório de Estabilidade Financeira (EEF)"
  financial_center_je_2_reason:0 "#l > Estabilidade do Setor Financeiro: #! \n\n #b O mercado especulativo#! atualmente representa #b [GetPlayer.MakeScope.ScriptValue('fiancial_center_week_balance_in_ratio')|%|]#! do #b [concept_gdp]#! nacional.\n\nQuanto maior a participação do [concept_gdp] detida pelo mercado especulativo, mais a bolha especulativa se intensificará de acordo com o seguinte modelo:\n\n #U - 0–10% → tensão especulativa bastante reduzida (−3)\n - 10–20% → tensão decrescente (−2)\n - 20–30% → ligeira diminuição (−1)\n - 30–40% → ligeiro aumento (+1)\n - 40–50% → aumento acentuado (+2)\n - 50%+ → forte crescimento da bolha (+3)#!\n\n#b Consequências atuais:#!\n - Redução da capacidade de [concept_construction] disponível (atual: [GetPlayer.MakeScope.ScriptValue('speculative_share_1_penality')|D=+] %)\n - Taxa de inovação mais lenta (atual: [GetPlayer.MakeScope.ScriptValue('speculative_share_1_penality')|D=+] %)\n - Diminuição do alvo de [concept_prosperity] de [concept_company] (atual: [GetPlayer.MakeScope.ScriptValue('speculative_share_1_penality')|D=+] %)\n - Perda de prestígio nacional (atual: [GetPlayer.MakeScope.ScriptValue('speculative_share_1_penality')|D=+] %)\n\nSe a bolha atingir #b 100%#! de progressão, um #b grande colapso financeiro#! atingirá a nação.\n\n#l > Estabilidade do Setor de Construção: #!\n\n O [GetBuildingType('building_ef_private_construction').GetName] reflete a demanda geral por projetos de [concept_construction] de indivíduos, bem como de [concept_company] de vários tamanhos.\n\n Ao contrário da capacidade pública de [GetBuildingType('building_construction_sector').GetName], a capacidade de [GetBuildingType('building_ef_private_construction').GetName] tem um máximo teórico — a demanda total da população por [concept_construction].\n \n Assim, existe uma relação direta entre o nível de [concept_urbanization] dos estados do país e sua capacidade máxima de [GetBuildingType('building_ef_private_construction').GetName].\n \n A [concept_base_rate_percentage], definida pelo Banco Central, atua como um multiplicador que vincula essas duas variáveis. Portanto, a capacidade máxima teórica de [GetBuildingType('building_ef_private_construction').GetName] do país (equivale a:\n \n #v Nível total de [GetBuildingType('building_urban_center').GetName] × (1 - Taxa básica x 10)#!\n \n #lore "Quanto maior a [concept_base_rate_percentage], mais o setor de construção se contrairá. Por outro lado, quando a [concept_base_rate_percentage] é baixa, o [GetBuildingType('building_ef_private_construction').GetName] atinge seu potencial máximo de demanda — igual ao número total de níveis de [GetBuildingType('building_urban_center').GetName] em todos os estados."#! \n \n #b Valor atual:#!\n - Número de [GetBuildingType('building_ef_private_construction').GetName] no país: #p [GetPlayer.MakeScope.ScriptValue('building_ef_private_construction_lvl')]#!\n - Nível total de [GetBuildingType('building_urban_center').GetName]: #p [GetPlayer.MakeScope.ScriptValue('building_urban_center_lvl')]#!\n - [concept_base_rate_percentage] atual: #p [GetPlayer.MakeScope.ScriptValue('base_rate_percentage_decimal')]%#!\n - Nível máximo teórico de PCS: #p [GetPlayer.MakeScope.ScriptValue('building_urban_center_lvl_by_base_rate')]#! #b (Ou seja [GetPlayer.MakeScope.ScriptValue('base_rate_to_pcs_factor')|%] de [GetPlayer.MakeScope.ScriptValue('building_urban_center_lvl')])#!\n \n Se o número total de níveis de [GetBuildingType('building_ef_private_construction').GetName] exceder este máximo teórico devido às condições de mercado, o país entra em uma #v Economia Superconstruída#!.\n \n Enquanto estiver em uma Economia Superconstruída, a barra de progresso aumentará em #U +1#! a cada mês, e sua porcentagem de conclusão determinará diretamente um modificador negativo para a produção de Produto Financeiro.\n \n Por outro lado, enquanto o nível atual de [GetBuildingType('building_ef_private_construction').GetName] estiver abaixo do nível máximo, você pode solicitar ao setor privado que construa mais, em troca de concessões econômicas."

  financial_center_je_2_reason_1:0 "O mercado especulativo#! atualmente representa #b [GetPlayer.MakeScope.ScriptValue('fiancial_center_week_balance_in_ratio')|%|]#! do #b [concept_gdp]#! nacional."

  financial_center_je_2_reason_1_2:0 "#U - 0–10% → tensão especulativa bastante reduzida (−3)\n - 10–20% → tensão decrescente (−2)\n - 20–30% → ligeira diminuição (−1)\n - 30–40% → ligeiro aumento (+1)\n - 40–50% → aumento acentuado (+2)\n - 50%+ → forte crescimento da bolha (+3)#!"

