critical_desc: "$critical$: Você tem um ano para reconstruir as reservas metálicas do seu banco central através de medidas como vendas massivas de moeda estrangeira, recapitalização direta do estado ou obtenção de empréstimos internacionais para o banco central."
stabilizing_desc: "$stabilizing$: Se nenhuma crise ocorrer por um ano inteiro, tanto a Instabilidade Econômica quanto os contadores de Crise serão reiniciados — mas apenas se a nação #l não estiver em guerra.#!"

