l_braz_por:

amendment_bimetallic_ratio_15_5_fra: "Razão Bimetálica Germinal"
amendment_bimetallic_ratio_15_5_fra_desc: "A paridade legal ouro-prata é fixada de acordo com o sistema monetário Germinal, estabelecendo uma razão bimetálica de 15,5 para 1."

amendment_bimetallic_ratio_15_5_latine_union: "Paridade Monetária Latina"
amendment_bimetallic_ratio_15_5_latine_union_desc: "A razão ouro-prata é alinhada com os padrões da União Monetária Latina, harmonizando a cunhagem bimetálica entre os estados participantes."

amendment_usa_bimetallic_ratio_1834: "Razão Bimetálica Americana Revisada"
amendment_usa_bimetallic_ratio_1834_desc: "A paridade ouro-prata é ajustada de acordo com a Lei de Cunhagem de 1834, elevando a razão legal para favorecer a prata sobre o ouro."

amendment_usa_bimetallic_ratio_1873: "Fim da Cunhagem Livre de Prata"
amendment_usa_bimetallic_ratio_1873_desc: "A cunhagem livre de prata é efetivamente suspensa, minando o sistema bimetálico e preparando a transição para um padrão monetário baseado em ouro."

amendment_spain_bimetallic_ratio_traditional: "Razão Bimetálica Tradicional Espanhola"
amendment_spain_bimetallic_ratio_traditional_desc: "A paridade ouro-prata reflete práticas monetárias espanholas de longa data, moldadas pela extensa produção de prata e circulação colonial."

amendment_german_bimetallic_ratio_conservative: "Paridade Bimetálica Conservadora Alemã"
amendment_german_bimetallic_ratio_conservative_desc: "O sistema monetário mantém uma razão ouro-prata cautelosa, favorecendo estabilidade e continuidade sobre ajustes rápidos às condições do mercado internacional."

amendment_netherlands_bimetallic_ratio: "Razão Bimetálica Administrativa Holandesa"
amendment_netherlands_bimetallic_ratio_desc: "A paridade ouro-prata é administrativamente alinhada com sistemas monetários vizinhos, preservando a circulação bimetálica sem obrigações formais de tratado."
